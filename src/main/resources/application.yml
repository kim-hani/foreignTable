spring:
  application:
    name: SmartWaiting

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5433/smartwaiting
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

  jackson:
    serialization:
      fail-on-empty-beans: false

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
        embedding:                          # RAG: 텍스트→벡터 변환기
          api-key: ${GEMINI_API_KEY}        # 임베딩 연결은 embedding 하위 api-key를 별도로 읽음(최상위 api-key 미상속) — 없으면 Vertex AI 모드로 간주해 project-id를 요구함
          text:
            model: text-embedding-004       # 768차원 (pgvector 인덱스 2000차원 한계 이내)
            task-type: RETRIEVAL_DOCUMENT   # 검색용 문서 임베딩 최적화
    vectorstore:
      pgvector:
        initialize-schema: true             # 기동 시 vector_store 테이블/인덱스 자동 생성
        index-type: HNSW                    # 근사 최근접 이웃 인덱스 (빠른 유사도 검색)
        distance-type: COSINE_DISTANCE      # 코사인 거리로 의미 유사도 측정
        dimensions: 768                     # ⚠️ 임베딩 모델 차원과 반드시 일치

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

admin:
  secret-key: ${ADMIN_SECRET_KEY}

# TODO: S3 인프라 구축 후 docker-compose.yml AWS 항목 주석 해제 + .env에 실제 값 입력
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME:local-bucket}
    credentials:
      access-key: ${AWS_ACCESS_KEY:local-placeholder}
      secret-key: ${AWS_SECRET_KEY:local-placeholder}
    region:
      static: ${AWS_REGION:ap-northeast-2}

springdoc:
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha        # 태그를 이름(번호) 오름차순 정렬 — @Tag 번호는 01~10 zero-padding 필요
    operations-sorter: method # 각 태그 내 오퍼레이션을 HTTP 메서드 순으로 정렬